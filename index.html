<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The first playable Phaser prototype for the Candy Box successor."
    />
    <title>Candy Box Phaser Prototype</title>
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <div>
          <p class="eyebrow">A tiny new beginning</p>
          <h1 id="location-title">CANDY BOX</h1>
          <p id="location-mood" class="location-mood">A single candy hums in the dark.</p>
        </div>
        <div class="header-actions">
          <p id="candy-counter" class="counter" aria-live="polite">Candies: 0/1</p>
          <button id="new-game" class="new-game" type="button">New game</button>
        </div>
      </header>
      <section class="game-frame" aria-label="Candy Box game area">
        <div id="game"></div>
      </section>
      <p id="interaction-prompt" class="interaction-prompt" hidden>Press E to talk to the blacksmith</p>
      <p id="dialogue-caption" class="dialogue-caption" aria-live="polite" hidden></p>
      <footer>
        <p>Move with WASD or the arrow keys. Follow the road to the fortress.</p>
        <p id="game-status" class="status" aria-live="polite">The candy is waiting.</p>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
